name: Iterate AI Knowledge Base

on:
  schedule:
    # 09:10 Asia/Shanghai, after the 08:30 Horizon digest.
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-knowledge-base-iteration
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Iterate knowledge base with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          HORIZON_FEED_URL: https://aaawangbo.github.io/Horizon/feed-zh.xml
        run: python knowledge-base/scripts/iterate.py --auto

      - name: Verify knowledge base
        run: python knowledge-base/scripts/iterate.py --lint

      - name: Commit verified iteration
        shell: bash
        run: |
          if git diff --quiet -- knowledge-base; then
            echo "No new knowledge-base changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-base
          git commit -m "chore(knowledge): daily self-iteration"
          git push
